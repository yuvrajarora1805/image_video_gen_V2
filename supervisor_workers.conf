[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=D:\xamp\php\php.exe D:\xamp\htdocs\imgen\public_html\public_html\artisan queue:work --queue=video_cpu --sleep=3 --tries=2 --max-time=3600
autostart=true
autorestart=true
